<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运价明镜 QuoteGuard 演示</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar no-print">
  <div class="bar-main">
    <div class="brand">运价明镜 <span class="brand-en">QuoteGuard</span></div>
    <div class="ctl" id="case-ctl" role="tablist" aria-label="案例"></div>
    <label class="ctl-sel">配置
      <select id="cfg-sel" aria-label="模型配置"></select>
    </label>
    <div class="spacer"></div>
    <input type="file" id="upload-input" hidden>
    <button type="button" id="upload-btn" class="btn">上传报价</button>
  </div>
  <div class="bar-sub" id="scenario"></div>
  <div class="notice" id="notice" hidden></div>
</header>
<div class="layout">
  <nav class="sidenav no-print" id="sidenav" aria-label="步骤"></nav>
  <main id="main" class="main"></main>
</div>
<footer class="footer no-print" id="footer"></footer>
<script src="app.js"></script>
</body>
</html>
