# 费用结构库。每项带 source_status（calibrated | estimated | synthetic_assumption | no_qualifying_units；
# pending_calibration 会使 test 集拒绝生成）、source_seed_ids、source_note。
# 海运渠道只写海派（按 kg 计价）。不含海卡、整柜或按 CBM 计价的结构。
version: 2
source_meta:    # 无逐项 source 的段落
  destinations: {source_status: synthetic_assumption, source_seed_ids: [], source_note: "公开仓库代码，邮编为代表性取值"}
  private_destinations: {source_status: synthetic_assumption, source_seed_ids: [], source_note: "合成私人地址"}
  claims: {source_status: synthetic_assumption, source_seed_ids: [], source_note: "合成资质宣称场景与比例"}
ship_date: {from: "2026-10-12", to: "2026-10-31"}
n_candidates: [4, 6]
mode_weights: {express: 2, air: 2, sea: 4}
private_address_prob: 0.15
modality_weights: {text: 4, table: 3, image: 3}
lang_mix_prob: 0.4
ddp_prob: 0.4
# 包税单价 = ratio * 税费下限 + factor * 同档不包税单价
ddp_floor_ratio: [0.3, 0.6, 0.8, 1.0, 1.15]
ddp_markup_factor: [0.6, 1.0]
liability_options: ["按运费 3 倍赔付", "按申报货值赔付，上限 20 美元/kg", "丢失按运费赔付，破损不赔"]
wording_pools:
  dev:
    ddp: [dev-ddp-1, dev-ddp-2, dev-ddp-3, dev-ddp-4]
    claim: [dev-claim-1, dev-claim-2, dev-claim-3, dev-claim-4]
  test:
    ddp: [test-ddp-1, test-ddp-2, test-ddp-3, test-ddp-4]
    claim: [test-claim-1, test-claim-2, test-claim-3, test-claim-4]
