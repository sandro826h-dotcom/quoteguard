    model: qwen3-vl-plus
    tier: vision
    vision_config_id: null
    temperature: 0
    max_tokens: 2000
    extra_payload: {enable_thinking: false}
    verified: false
  - config_id: glm
    provider: siliconflow
    model: zai-org/GLM-5.3
    tier: strong
    vision_config_id: glm_v
    temperature: 0
    max_tokens: 2000
    extra_payload: {enable_thinking: false}
    verified: false
  - config_id: glm_v
    provider: siliconflow
    model: zai-org/GLM-4.5V
    tier: vision
    vision_config_id: null
    temperature: 0
    max_tokens: 2000
    extra_payload: {enable_thinking: false}
    verified: false
  - config_id: kimi
    provider: siliconflow
    model: Pro/moonshotai/Kimi-K2.6
