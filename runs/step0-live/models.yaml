# Model configurations for experiments. Model names and the thinking-switch parameter
# names (enable_thinking, thinking) are unverified: 参数名待预试验第 0 步核实.
# Model names are checked against each provider's /models listing (executor check subcommand).
# verified: true = model name confirmed against the provider /models listing on 2026-10-10
# (ds_flash, ds_flash_think, qwen_max, kimi). Other entries are still unconfirmed.
# image_token_bound (optional, default 4000): per-image token allowance in the cost upper bound.
# tier: strong | low | dev | vision (vision-only configs referenced by vision_config_id)
models:
  - config_id: ds_pro
    provider: deepseek
    model: deepseek-v4-pro
    tier: strong
    vision_config_id: ds_flash
    temperature: 0
    max_tokens: 2000
    extra_payload: {thinking: {type: disabled}}
    verified: false
  - config_id: ds_flash
    provider: deepseek
    model: deepseek-flash
    tier: low
    vision_config_id: ds_flash
    temperature: 0
    max_tokens: 2000
    extra_payload: {thinking: {type: disabled}}
    verified: true
  - config_id: ds_flash_think
    provider: deepseek
    model: deepseek-flash
    tier: low
    vision_config_id: ds_flash
    temperature: null
    max_tokens: 8000
    extra_payload: {thinking: {type: enabled}}
    verified: true
  - config_id: qwen_max
    provider: dashscope
    model: qwen3.8-max-0902
    tier: strong
    vision_config_id: qwen_vl
    temperature: 0
    max_tokens: 2000
    extra_payload: {enable_thinking: false}
    verified: true
  - config_id: qwen_plus
